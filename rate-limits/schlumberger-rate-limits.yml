description: SLB (Schlumberger) does not publish public API rate limits reachable in this reconciliation
  pass; limits are governed by the customer's commercial / partner agreement. Consumers should honor 429
  / 503 responses where they appear and follow standard exponential-backoff guidance.
notes: SLB (Schlumberger) is an energy services and software vendor; platform / digital APIs (e.g. DELFI,
  OSDU-aligned services) are sold via the SLB Digital Platform Partner Program and enterprise sales engagement.
  There is no public self-service pricing page.
